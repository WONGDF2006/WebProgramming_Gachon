<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Contrast</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 520px; margin: 0 auto; color: #1e293b; }
    .pickers { display: flex; flex-wrap: wrap; gap: 16px; margin: 16px 0; }
    label { font-weight: 600; font-size: .9rem; }
    input[type="color"] { display: block; width: 80px; height: 40px; margin-top: 4px; border: none; }
    .preview { padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
    .preview p { margin: 0 0 8px; }
    .ratio { margin-top: 14px; font-size: 1.4rem; font-weight: 800; }
    .result { margin: 4px 0; }
    .pass { color: #16a34a; }
    .fail { color: #dc2626; }
  </style>
</head>
<body>
  <!-- WCAG AA contrast rules:
       - Body text: at least 4.5 : 1
       - Large text (24px, or 18.66px bold): at least 3 : 1
       Light grey on white is the most common failure in student projects. -->
  <h1>Color contrast checker</h1>
  <p>Pick text and background colours. WCAG AA needs <strong>4.5 : 1</strong> for body text.</p>

  <div class="pickers">
    <label>Text <input type="color" id="fg" value="#94a3b8"></label>
    <label>Background <input type="color" id="bg" value="#ffffff"></label>
  </div>

  <div class="preview" id="preview">
    <p>Body text: can everyone read this sentence comfortably?</p>
    <p style="font-size: 24px; font-weight: 700;">Large heading text</p>
  </div>

  <p class="ratio" id="ratio"></p>
  <p class="result" id="body-result"></p>
  <p class="result" id="large-result"></p>

  <script>
    const fg = document.querySelector('#fg');
    const bg = document.querySelector('#bg');

    // Relative luminance, from the WCAG definition
    function luminance(hex) {
      const channels = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
      const [r, g, b] = channels.map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function contrast(a, b) {
      const [light, dark] = [luminance(a), luminance(b)].sort((x, y) => y - x);
      return (light + 0.05) / (dark + 0.05);
    }

    function showResult(el, label, ratio, needed) {
      const pass = ratio >= needed;
      el.className = 'result ' + (pass ? 'pass' : 'fail');
      el.textContent = (pass ? '✓ Pass' : '✗ Fail') + ' — ' + label + ' (needs ' + needed + ' : 1)';
    }

    function update() {
      const preview = document.querySelector('#preview');
      preview.style.color = fg.value;
      preview.style.background = bg.value;

      const ratio = contrast(fg.value, bg.value);
      document.querySelector('#ratio').textContent = ratio.toFixed(2) + ' : 1';
      showResult(document.querySelector('#body-result'), 'body text', ratio, 4.5);
      showResult(document.querySelector('#large-result'), 'large text', ratio, 3);
    }

    fg.addEventListener('input', update);
    bg.addEventListener('input', update);
    update();
  </script>
</body>
</html>
