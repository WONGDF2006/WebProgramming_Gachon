<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Navigation</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 520px; margin: 0 auto; color: #1e293b; }
    button { padding: 8px 16px; font: 600 1rem system-ui, sans-serif; border: 2px solid #1a56db; border-radius: 8px; cursor: pointer; color: #1a56db; background: white; }
    /* Never remove the focus ring without a replacement */
    :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }

    [role="tablist"] { display: flex; gap: 6px; margin-top: 20px; }
    [role="tab"][aria-selected="true"] { color: white; background: #1a56db; }
    [role="tabpanel"] { margin-top: 10px; padding: 14px; border-radius: 8px; background: #f1f5f9; }

    dialog { max-width: 360px; border: none; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
    dialog::backdrop { background: rgba(15, 23, 42, .5); }
  </style>
</head>
<body>
  <!-- Everything a mouse can do, the keyboard must do too:
       Tab / Shift+Tab → move focus     Enter / Space → activate
       Arrow keys      → move inside a widget (tabs, menus)
       Escape          → close dialogs and popups
       Put the mouse away and try every control below. -->
  <h1>Keyboard navigation</h1>
  <p>Use only <kbd>Tab</kbd>, <kbd>Enter</kbd>, <kbd>Space</kbd>, <kbd>←</kbd> <kbd>→</kbd>, and <kbd>Esc</kbd>.</p>

  <div role="tablist" aria-label="Week days">
    <button role="tab" id="tab-1" aria-selected="true" aria-controls="panel-1">Mon</button>
    <button role="tab" id="tab-2" aria-selected="false" aria-controls="panel-2" tabindex="-1">Wed</button>
    <button role="tab" id="tab-3" aria-selected="false" aria-controls="panel-3" tabindex="-1">Fri</button>
  </div>
  <div role="tabpanel" id="panel-1" aria-labelledby="tab-1">Monday: lecture.</div>
  <div role="tabpanel" id="panel-2" aria-labelledby="tab-2" hidden>Wednesday: study group.</div>
  <div role="tabpanel" id="panel-3" aria-labelledby="tab-3" hidden>Friday: practical lab.</div>

  <p><button type="button" id="open-dialog">Open dialog</button></p>

  <!-- <dialog> with showModal() traps focus and closes on Escape for free -->
  <dialog id="dialog">
    <h2>Keyboard friendly dialog</h2>
    <p>Press <kbd>Esc</kbd> or the button to close. Focus returns to "Open dialog".</p>
    <button type="button" id="close-dialog">Close</button>
  </dialog>

  <script>
    // Tabs: arrow keys move between tabs (only the active tab is in the Tab order)
    const tabs = [...document.querySelectorAll('[role="tab"]')];

    function selectTab(tab) {
      tabs.forEach((t) => {
        const selected = t === tab;
        t.setAttribute('aria-selected', String(selected));
        t.tabIndex = selected ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !selected;
      });
      tab.focus();
    }

    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => selectTab(tab));
      tab.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') selectTab(tabs[(i + 1) % tabs.length]);
        if (e.key === 'ArrowLeft') selectTab(tabs[(i - 1 + tabs.length) % tabs.length]);
      });
    });

    const dialog = document.querySelector('#dialog');
    document.querySelector('#open-dialog').addEventListener('click', () => dialog.showModal());
    document.querySelector('#close-dialog').addEventListener('click', () => dialog.close());
  </script>
</body>
</html>
