<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 4 · Fetch — Call the API</title>
  <!--
    STEP 4 · FETCH — CALL THE API
    Task: send the query to the Open Library Search API.
      - build the URL: https://openlibrary.org/search.json?q=QUERY&limit=12
        (use encodeURIComponent on the query)
      - await fetch(url), check res.ok, then await res.json()
      - console.log the books array (data.docs) and show how many came back
      - wrap the call in try/catch and show an error message if it fails
    Test: search "harry potter" and expand data.docs in the Console.
  -->
  <style>
    :root {
      --navy: #1b2540;
      --blue: #1a56db;
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #cbd5e1;
      --ink: #1e293b;
      --muted: #64748b;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .site-header { padding: 28px 16px; text-align: center; color: white; background: var(--navy); }
    .site-header h1 { margin: 0 0 4px; }
    .site-header p { margin: 0; color: #a5b4cf; font-size: .9rem; }

    main { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }

    .search-bar { display: flex; gap: 10px; margin-bottom: 12px; }
    .search-bar input { flex: 1; min-width: 0; padding: 12px 16px; font-size: 1rem; border: 2px solid var(--line); border-radius: 8px; }
    .search-bar input:focus { outline: none; border-color: var(--blue); }
    .search-bar button { padding: 12px 28px; font-size: 1rem; font-weight: 700; color: white; background: var(--blue); border: none; border-radius: 8px; cursor: pointer; }

    .status { min-height: 1.5em; margin: 0 0 16px; color: var(--muted); }

    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .book-card { display: flex; flex-direction: column; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .book-card img, .no-cover { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #e2e8f0; }
    .no-cover { display: grid; place-items: center; font-size: 3rem; }
    .book-info { padding: 12px 14px 16px; }
    .book-info h2 { margin: 0 0 6px; font-size: .95rem; line-height: 1.3; }
    .book-info p { margin: 0; color: var(--muted); font-size: .82rem; }

    .site-footer { padding: 20px 16px; text-align: center; color: var(--muted); font-size: .85rem; }
    .site-footer a { color: var(--blue); }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>📚 Book Search</h1>
    <p>Search the Open Library — millions of books, free</p>
  </header>

  <main>
    <form id="search-form" class="search-bar" role="search">
      <label for="search-input" class="visually-hidden">Book title</label>
      <input id="search-input" type="search" name="q" placeholder="e.g. harry potter" required>
      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="results" class="results" aria-label="Search results"></section>
  </main>

  <footer class="site-footer">
    <p>Data from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></p>
  </footer>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const statusText = document.getElementById('status');

    const API = 'https://openlibrary.org/search.json';

    async function searchBooks(query) {
      const url = API + '?q=' + encodeURIComponent(query) + '&limit=12';
      const res = await fetch(url);
      if (!res.ok) throw new Error('Server answered with status ' + res.status);
      const data = await res.json();
      return data.docs;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) {
        statusText.textContent = 'Please type a book title.';
        return;
      }
      statusText.textContent = 'Searching for "' + query + '"…';

      try {
        const books = await searchBooks(query);
        console.log('Books:', books);
        statusText.textContent = 'Found ' + books.length + ' books — check the Console.';
      } catch (err) {
        console.error('Error:', err);
        statusText.textContent = 'Something went wrong. Check your connection and try again.';
      }
    });
  </script>
</body>
</html>
