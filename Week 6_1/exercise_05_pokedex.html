<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin-top: 0; }

    form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; min-width: 180px; padding: 10px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { padding: 10px 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; color: white; background: #dc2626; }
    button.secondary { background: #475569; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .card { padding: 24px; border-radius: 14px; background: white; box-shadow: 0 6px 20px rgba(15, 23, 42, .08); }
    .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .top img { width: 160px; height: 160px; image-rendering: auto; background: #fef2f2; border-radius: 50%; }
    .top h2 { margin: 0; font-size: 1.6rem; text-transform: capitalize; }
    .num { margin: 0 0 8px; color: #64748b; }
    .types { display: flex; gap: 6px; margin: 8px 0; }
    .type { padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; color: white; text-transform: capitalize; background: #64748b; }
    .size { margin: 4px 0 0; font-size: .9rem; color: #475569; }

    .stats { margin-top: 20px; }
    .stat { display: grid; grid-template-columns: 110px 36px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .9rem; }
    .stat span:first-child { text-transform: capitalize; color: #475569; }
    .stat b { text-align: right; }
    .bar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
    .bar div { height: 100%; background: #dc2626; }

    .muted { color: #64748b; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <h1>Pokédex</h1>
    <p class="muted">Search the full database at <code>pokeapi.co</code> by name or number.</p>

    <form id="search-form">
      <input id="search" placeholder="e.g. pikachu or 25" value="pikachu" aria-label="Pokémon name or number" required>
      <button type="submit" id="search-btn">Search</button>
      <button type="button" id="random-btn" class="secondary">Random</button>
    </form>

    <div id="result" aria-live="polite"></div>
  </main>

  <script>
    const MAX_ID = 1025; // number of Pokémon in the main series

    const form = document.querySelector('#search-form');
    const input = document.querySelector('#search');
    const searchBtn = document.querySelector('#search-btn');
    const randomBtn = document.querySelector('#random-btn');
    const resultBox = document.querySelector('#result');

    const TYPE_COLOURS = {
      normal: '#a8a77a', fire: '#ee8130', water: '#6390f0', electric: '#d4a910', grass: '#4caf50',
      ice: '#5ec8c3', fighting: '#c22e28', poison: '#a33ea1', ground: '#c2a14a', flying: '#8f7dd6',
      psychic: '#f95587', bug: '#8f9c1a', rock: '#a69033', ghost: '#735797', dragon: '#6f35fc',
      dark: '#705746', steel: '#8a8aa8', fairy: '#d685ad'
    };

    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    async function loadPokemon(nameOrId) {
      const query = String(nameOrId).trim().toLowerCase();
      if (!query) return;

      searchBtn.disabled = randomBtn.disabled = true;
      resultBox.replaceChildren(makeEl('p', 'muted', 'Searching…'));

      try {
        const res = await fetch('https://pokeapi.co/api/v2/pokemon/' + encodeURIComponent(query));
        // 404 is not a network error — fetch still resolves, so check it ourselves
        if (res.status === 404) {
          resultBox.replaceChildren(makeEl('p', 'error', 'No Pokémon called "' + query + '". Check the spelling.'));
          return;
        }
        if (!res.ok) throw new Error('Server answered with status ' + res.status);
        render(await res.json());
      } catch (err) {
        console.error('Error:', err);
        resultBox.replaceChildren(makeEl('p', 'error', 'Could not reach the Pokédex. Check your connection and try again.'));
      } finally {
        searchBtn.disabled = randomBtn.disabled = false;
      }
    }

    function render(p) {
      const card = makeEl('article', 'card');

      const img = document.createElement('img');
      img.src = p.sprites.other['official-artwork'].front_default || p.sprites.front_default || '';
      img.alt = p.name;

      const types = makeEl('div', 'types');
      p.types.forEach(({ type }) => {
        const badge = makeEl('span', 'type', type.name);
        badge.style.background = TYPE_COLOURS[type.name] || '';
        types.appendChild(badge);
      });

      const info = makeEl('div');
      info.append(
        makeEl('p', 'num', '#' + String(p.id).padStart(4, '0')),
        makeEl('h2', '', p.name),
        types,
        // height is in decimetres, weight in hectograms
        makeEl('p', 'size', 'Height ' + (p.height / 10) + ' m · Weight ' + (p.weight / 10) + ' kg')
      );

      const top = makeEl('div', 'top');
      top.append(img, info);

      const stats = makeEl('div', 'stats');
      p.stats.forEach((s) => {
        const row = makeEl('div', 'stat');
        const bar = makeEl('div', 'bar');
        const fill = makeEl('div');
        fill.style.width = Math.min(100, s.base_stat / 255 * 100) + '%';
        bar.appendChild(fill);
        row.append(makeEl('span', '', s.stat.name.replace('-', ' ')), makeEl('b', '', s.base_stat), bar);
        stats.appendChild(row);
      });

      card.append(top, stats);
      resultBox.replaceChildren(card);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      loadPokemon(input.value);
    });

    randomBtn.addEventListener('click', () => {
      const id = Math.floor(Math.random() * MAX_ID) + 1;
      input.value = id;
      loadPokemon(id);
    });

    loadPokemon(input.value);
  </script>
</body>
</html>
