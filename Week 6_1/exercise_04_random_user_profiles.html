<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Profiles</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin-top: 0; }

    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    select { padding: 9px 12px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    button { padding: 10px 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; color: white; background: #16a34a; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .profile { padding: 24px 18px; border-radius: 14px; text-align: center; background: white; box-shadow: 0 6px 20px rgba(15, 23, 42, .08); }
    .profile img { width: 96px; height: 96px; border-radius: 50%; border: 4px solid #dcfce7; }
    .profile h2 { margin: 12px 0 4px; font-size: 1.1rem; }
    .profile p { margin: 4px 0; font-size: .9rem; overflow-wrap: anywhere; }
    .location { color: #16a34a; font-weight: 600; }
    .muted { color: #64748b; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <h1>Random User Profiles</h1>
    <p class="muted">Fake people from <code>randomuser.me/api</code> — photos, names and emails.</p>

    <div class="controls">
      <label for="count">How many:</label>
      <select id="count">
        <option>3</option>
        <option selected>6</option>
        <option>9</option>
        <option>12</option>
      </select>
      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="">Any</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
      </select>
      <button id="load-btn">Load Users</button>
    </div>

    <div id="users" class="grid" aria-live="polite"></div>
  </main>

  <script>
    const countSelect = document.querySelector('#count');
    const genderSelect = document.querySelector('#gender');
    const loadBtn = document.querySelector('#load-btn');
    const usersBox = document.querySelector('#users');

    function makeEl(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    async function loadUsers() {
      // URLSearchParams builds "?results=6&gender=female" for us
      const params = new URLSearchParams({ results: countSelect.value });
      if (genderSelect.value) params.set('gender', genderSelect.value);

      loadBtn.disabled = true;
      usersBox.replaceChildren(makeEl('p', 'muted', 'Loading…'));

      try {
        const res = await fetch('https://randomuser.me/api/?' + params);
        if (!res.ok) throw new Error('Server answered with status ' + res.status);
        const data = await res.json();
        usersBox.replaceChildren(...data.results.map(renderUser));
      } catch (err) {
        console.error('Error:', err);
        usersBox.replaceChildren(makeEl('p', 'error', 'Could not load users. Check your connection and try again.'));
      } finally {
        loadBtn.disabled = false;
      }
    }

    function renderUser(user) {
      const card = makeEl('article', 'profile');
      const fullName = user.name.first + ' ' + user.name.last;

      const img = document.createElement('img');
      img.src = user.picture.large;
      img.alt = 'Photo of ' + fullName;

      card.append(
        img,
        makeEl('h2', '', fullName),
        makeEl('p', 'location', user.location.city + ', ' + user.location.country),
        makeEl('p', '', user.email),
        makeEl('p', 'muted', user.phone),
        makeEl('p', 'muted', 'Age ' + user.dob.age)
      );
      return card;
    }

    loadBtn.addEventListener('click', loadUsers);
    loadUsers();
  </script>
</body>
</html>
