<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Fetcher</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { margin-top: 0; }
    h2 { margin-top: 36px; font-size: 1.15rem; }

    .card { padding: 24px; border-radius: 14px; background: white; box-shadow: 0 6px 20px rgba(15, 23, 42, .08); min-height: 140px; }
    .setup { margin: 0 0 14px; font-size: 1.2rem; font-weight: 600; }
    .punchline { margin: 0; font-size: 1.1rem; color: #0f766e; }
    .placeholder { margin: 0; color: #64748b; }
    .error { margin: 0; color: #dc2626; }

    .loading { display: flex; align-items: center; gap: 12px; margin: 0; color: #64748b; }

    /* Challenge: spinner animation */
    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #cbd5e1;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button { padding: 10px 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; color: white; background: #1a56db; }
    button.secondary { background: #0f766e; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #favourites { padding: 0; list-style: none; }
    #favourites li { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; padding: 14px 16px; margin-bottom: 10px; border-radius: 10px; background: white; }
    #favourites li p { margin: 0 0 4px; }
    #favourites .remove { flex: none; padding: 4px 10px; font-size: .85rem; background: #dc2626; }
    .muted { color: #64748b; }
  </style>
</head>
<body>
  <main>
    <h1>Random Joke Fetcher</h1>

    <div class="card" id="joke-box" aria-live="polite">
      <p class="placeholder">Press "Load Joke" to get a joke.</p>
    </div>

    <div class="buttons">
      <button id="load-btn">Load Joke</button>
      <button id="save-btn" class="secondary" disabled>Save Favourite</button>
    </div>

    <h2>Favourite jokes</h2>
    <ul id="favourites"></ul>
    <p id="no-favourites" class="muted">No favourites saved yet.</p>
  </main>

  <script>
    const API_URL = 'https://official-joke-api.appspot.com/random_joke';
    const STORAGE_KEY = 'favourite-jokes';

    const jokeBox = document.querySelector('#joke-box');
    const loadBtn = document.querySelector('#load-btn');
    const saveBtn = document.querySelector('#save-btn');
    const favList = document.querySelector('#favourites');
    const noFavs = document.querySelector('#no-favourites');

    let currentJoke = null;

    // Replaces everything inside the joke box with the given elements
    function show(...elements) {
      jokeBox.textContent = '';
      elements.forEach((el) => jokeBox.appendChild(el));
    }

    // Makes a <p> with a class and plain text (textContent keeps it safe)
    function makeP(className, text) {
      const p = document.createElement('p');
      p.className = className;
      p.textContent = text;
      return p;
    }

    function showLoading() {
      const p = makeP('loading', 'Loading…');
      const spinner = document.createElement('span');
      spinner.className = 'spinner';
      p.prepend(spinner);
      show(p);
    }

    async function loadJoke() {
      loadBtn.disabled = true;
      saveBtn.disabled = true;
      currentJoke = null;
      showLoading();

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Server answered with status ' + res.status);
        const joke = await res.json();
        if (!joke.setup || !joke.punchline) throw new Error('The joke was missing its text');

        currentJoke = { id: joke.id, setup: joke.setup, punchline: joke.punchline };
        show(makeP('setup', joke.setup), makeP('punchline', joke.punchline));
        saveBtn.disabled = isSaved(currentJoke);
      } catch (err) {
        console.error('Error:', err);
        show(makeP('error', 'Sorry, we could not load a joke right now. Check your internet connection and try again.'));
      } finally {
        loadBtn.disabled = false;
      }
    }

    // ── Extra: favourites saved in localStorage ──
    function getFavourites() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch (e) {
        return [];
      }
    }

    function setFavourites(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }

    function isSaved(joke) {
      return getFavourites().some((fav) => fav.id === joke.id);
    }

    function renderFavourites() {
      const favs = getFavourites();
      favList.textContent = '';

      favs.forEach((fav) => {
        const li = document.createElement('li');
        const text = document.createElement('div');
        text.append(makeP('', fav.setup), makeP('punchline', fav.punchline));

        const remove = document.createElement('button');
        remove.className = 'remove';
        remove.textContent = 'Remove';
        remove.dataset.id = fav.id;

        li.append(text, remove);
        favList.appendChild(li);
      });

      noFavs.hidden = favs.length > 0;
    }

    saveBtn.addEventListener('click', () => {
      if (!currentJoke || isSaved(currentJoke)) return;
      setFavourites([...getFavourites(), currentJoke]);
      saveBtn.disabled = true;
      renderFavourites();
    });

    // Event delegation: one listener handles every Remove button
    favList.addEventListener('click', (e) => {
      if (!e.target.classList.contains('remove')) return;
      const id = Number(e.target.dataset.id);
      setFavourites(getFavourites().filter((fav) => fav.id !== id));
      renderFavourites();
      if (currentJoke && currentJoke.id === id) saveBtn.disabled = false;
    });

    loadBtn.addEventListener('click', loadJoke);
    renderFavourites();
  </script>
</body>
</html>
