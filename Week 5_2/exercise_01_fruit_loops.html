<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Loops</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #1e293b; }
    h1 { color: #0f766e; }
    h2 { font-size: 1.1rem; margin-top: 28px; }
    li { padding: 4px 0; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px 12px; font-size: 1rem; border: 2px solid #cbd5e1; border-radius: 8px; }
    button { padding: 8px 18px; font-size: 1rem; font-weight: 600; color: white; background: #0f766e; border: none; border-radius: 8px; cursor: pointer; }
    #fruit-count { color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Fruit Loops</h1>

  <h2>Repeat 5 times</h2>
  <ul id="steps"></ul>

  <h2>Loop through an array</h2>
  <form id="fruit-form">
    <input id="fruit-input" type="text" placeholder="Add a fruit...">
    <button type="submit">Add fruit</button>
  </form>
  <ul id="fruit-list"></ul>
  <p id="fruit-count"></p>

  <script>
    // Adds one <li> with the given text to a list
    function addItem(list, text) {
      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
    }

    // Repeat 5 times
    const steps = document.querySelector('#steps');
    for (let i = 1; i <= 5; i++) {
      console.log('Step ' + i);
      addItem(steps, 'Step ' + i);
    }

    // Loop through an array
    const fruitList = document.querySelector('#fruit-list');
    const fruitCount = document.querySelector('#fruit-count');
    let fruits = ['apple', 'banana', 'cherry'];

    // Clears the list, then loops through the whole array again to redraw it
    function showFruits() {
      fruitList.textContent = '';
      for (let fruit of fruits) {
        console.log(fruit);
        addItem(fruitList, fruit);
      }
      fruitCount.textContent = fruits.length + ' fruits in the array';
    }

    showFruits();

    // Add a new fruit to the array, then run the loop again
    const form = document.querySelector('#fruit-form');
    const input = document.querySelector('#fruit-input');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const fruit = input.value.trim();
      if (!fruit) return;

      fruits.push(fruit);
      showFruits();
      input.value = '';
    });
  </script>
</body>
</html>
