<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Validation Attributes</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    input { width: 100%; padding: 9px 12px; font-size: 1rem; border: 2px solid #c8d4f0; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 20px; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- Validation rules written as attributes. The browser checks them when
       the form is SUBMITTED and shows its own error bubble — no JavaScript needed. -->
  <h1>Validation Attributes</h1>
  <p>Press Submit with empty or wrong values to see the browser's messages.</p>

  <form>
    <!-- required: must not be empty -->
    <label for="v1">required</label>
    <input type="text" id="v1" required>

    <!-- minlength / maxlength: number of characters -->
    <label for="v2">minlength="3" maxlength="10"</label>
    <input type="text" id="v2" minlength="3" maxlength="10">

    <!-- min / max: number (or date) range -->
    <label for="v3">min="1" max="100"</label>
    <input type="number" id="v3" min="1" max="100">

    <!-- step: allowed jumps -> 0, 5, 10, 15... -->
    <label for="v4">step="5"</label>
    <input type="number" id="v4" min="0" max="100" step="5">

    <!-- pattern: a regular expression the WHOLE value must match.
         Always add title — it becomes part of the error message. -->
    <label for="v5">pattern="\d{9}" (9-digit student ID)</label>
    <input type="text" id="v5" pattern="\d{9}" title="Enter your 9-digit student ID" placeholder="202112345">

    <!-- type="email" brings its own format check -->
    <label for="v6">type="email"</label>
    <input type="email" id="v6" placeholder="name@example.com">

    <button type="submit">Submit</button>
  </form>
</body>
</html>
