<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Validation Pseudo-classes</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    input {
      width: 100%; padding: 10px 14px; font-size: 1rem; box-sizing: border-box;
      border: 2px solid #c8d4f0; border-radius: 8px; outline: none; transition: all .2s;
    }

    /* :focus — the input the user is typing in */
    input:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, .2);
    }

    /* :valid / :invalid — the browser updates these on every keystroke.
       Plain input:invalid would make an EMPTY required field red before the
       user has typed anything. :placeholder-shown is true while the field is
       empty, so :not(:placeholder-shown) waits until there is some text. */
    input:valid:not(:placeholder-shown) {
      border-color: #16a34a;
      background: #dcfce7;
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #dc2626;
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <h1>Type to see the colours change</h1>
  <!-- :placeholder-shown only works if the input HAS a placeholder -->

  <label for="p-email">Email (required, valid format)</label>
  <input type="email" id="p-email" required placeholder="Type an email address...">

  <label for="p-pw">Password (minlength 8)</label>
  <input type="password" id="p-pw" required minlength="8" placeholder="At least 8 characters...">

  <label for="p-id">Student ID (pattern: 9 digits)</label>
  <input type="text" id="p-id" required pattern="\d{9}" title="9-digit student ID" placeholder="202112345">
</body>
</html>
