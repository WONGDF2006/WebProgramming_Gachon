<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fieldset and Legend</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 30px 16px; max-width: 460px; margin: 0 auto; color: #1e293b; }
    fieldset { border: 2px solid #c8d4f0; border-radius: 10px; padding: 8px 18px 18px; margin: 0 0 16px; }
    legend { font-weight: 700; color: #1a56db; padding: 0 8px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
    input, select { width: 100%; padding: 9px 12px; font-size: 1rem; border: 2px solid #c8d4f0; border-radius: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <!-- <fieldset> groups related controls and draws a border around them.
       <legend> is the group's title; screen readers announce it before each field. -->
  <h1>Register</h1>

  <form method="post" action="/register">
    <fieldset>
      <legend>Personal Information</legend>
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="first_name" required>
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="last_name" required>
    </fieldset>

    <fieldset>
      <legend>Account Details</legend>
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="email" required>
      <label for="reg-pw">Password</label>
      <input type="password" id="reg-pw" name="password" required>
      <label for="reg-major">Major</label>
      <select id="reg-major" name="major">
        <option value="">-- Select Major --</option>
        <option>Computer Science</option>
        <option>Software Engineering</option>
        <option>AI</option>
      </select>
    </fieldset>

    <button type="submit">Register</button>
  </form>
</body>
</html>
