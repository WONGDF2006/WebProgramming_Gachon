<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; font-family: system-ui, sans-serif; color: #1e293b; background: #f0f4ff; }
    main { max-width: 520px; margin: 0 auto; padding: 28px; border-radius: 14px; background: white; box-shadow: 0 6px 20px rgba(15, 23, 42, .08); }
    h1 { margin-top: 0; }

    fieldset { border: 2px solid #c8d4f0; border-radius: 10px; padding: 6px 18px 18px; margin: 0 0 18px; }
    legend { font-weight: 700; color: #1a56db; padding: 0 8px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
    .hint { font-weight: 400; color: #64748b; }

    input, select {
      width: 100%; padding: 10px 12px; font-size: 1rem; font-family: inherit; color: inherit;
      border: 2px solid #c8d4f0; border-radius: 8px; background: white;
      outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
    }

    /* Validation states */
    input:focus, select:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, .15);
    }
    input:valid:not(:placeholder-shown) { border-color: #16a34a; background: #f0fdf4; }
    input:invalid:not(:placeholder-shown) { border-color: #dc2626; background: #fef2f2; }
    /* A select has no placeholder, so colour it once the user has picked something */
    select:valid { border-color: #16a34a; }

    /* Checkbox and range keep their normal look */
    input[type="checkbox"], input[type="range"] { width: auto; padding: 0; border: none; background: none; box-shadow: none; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .checkbox-row label { margin: 0; }

    .range-row { display: flex; align-items: center; gap: 12px; }
    .range-row input { flex: 1; }
    output { min-width: 70px; font-weight: 700; color: #1a56db; }

    button { width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem; font-weight: 700; color: white; background: #1a56db; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1240b0; }
  </style>
</head>
<body>
  <main>
    <h1>Student Registration</h1>

    <form method="post" action="/register">
      <fieldset>
        <legend>Personal Info</legend>

        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full_name" required placeholder="Kim Minjun">

        <label for="student-id">Student ID <span class="hint">(9 digits)</span></label>
        <input type="text" id="student-id" name="student_id" required
               pattern="\d{9}" inputmode="numeric" title="Enter your 9-digit student ID" placeholder="202112345">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob">

        <label for="major">Major</label>
        <select id="major" name="major" required>
          <option value="">-- Choose your major --</option>
          <option value="cs">Computer Science</option>
          <option value="sw">Software Engineering</option>
          <option value="ai">Artificial Intelligence</option>
          <option value="ds">Data Science</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Account Info</legend>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="name@gachon.ac.kr">

        <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
        <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters">

        <label for="phone">Phone <span class="hint">(010-1234-5678)</span></label>
        <input type="tel" id="phone" name="phone"
               pattern="\d{3}-\d{4}-\d{4}" title="Use the format 010-1234-5678" placeholder="010-1234-5678">

        <!-- Bonus: range slider with a live value -->
        <label for="experience">Years of coding experience</label>
        <div class="range-row">
          <input type="range" id="experience" name="experience" min="0" max="10" value="0">
          <output id="experience-value" for="experience">0 years</output>
        </div>
      </fieldset>

      <div class="checkbox-row">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms</label>
      </div>

      <button type="submit">Register</button>
    </form>
  </main>

  <script>
    // Bonus: show the slider's current value while it moves
    const slider = document.querySelector('#experience');
    const sliderValue = document.querySelector('#experience-value');

    slider.addEventListener('input', () => {
      const years = Number(slider.value);
      sliderValue.textContent = years + (years === 1 ? ' year' : ' years');
    });
  </script>
</body>
</html>
