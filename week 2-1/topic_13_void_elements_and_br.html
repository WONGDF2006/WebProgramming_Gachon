<body>
  <!-- Legitimate use of br: a mailing address -->
  <address>
    Prof. Kim Jisoo<br>
    Department of Computer Science<br>
    Gachon University, Seongnam<br>
    Gyeonggi-do, South Korea
  </address>

  <!-- Void elements — no closing tag needed -->
  <img src="photo.webp" alt="Profile photo" width="300" height="200">
  <meta charset="UTF-8">
  <input type="text" placeholder="Name">
  <hr>  <!-- horizontal rule -->

  <!-- Wrong uses -->
  <!-- </br>  ← invalid closing tag for void element -->
  <!-- <br><br><br><br> to create space ← use CSS margin instead -->
</body>
