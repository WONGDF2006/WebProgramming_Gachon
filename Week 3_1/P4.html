<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  /* Declare CSS variables */
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #134e4a;
    --radius: 12px;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #14b8a6;
      --accent: #2dd4bf;
      --bg: #134e4a;
      --text: #f0fdfa;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: sans-serif;
    padding: 20px;
  }

  .btn {
    /* Use primary variable */
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: var(--radius);
  }

  .card {
    /* Use CSS variables */
    background: var(--bg);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 16px;
  }
</style>

</head>
<body>

  <button class="btn">Click Me</button>

  <div class="card">
    A themed card using CSS variables
  </div>

</body>
</html>
