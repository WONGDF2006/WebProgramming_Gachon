<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
  /* CSS variables */
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #134e4a;
    --radius: 12px;
  }

  /* Reset */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Body styles */
  body {
    font-family: sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px;
  }

  h1 {
    margin-bottom: 24px;
  }

  /* Grid — 1 column by default */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  /* 3 columns on screens 640px or wider */
  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* Cards */
  .card {
    border: 2px solid var(--accent);
    padding: 20px;
    border-radius: var(--radius);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  /* Hover lift effect */
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }

  /* Display the data-icon before the card content */
  .card[data-icon]::before {
    content: attr(data-icon) '  ';
    font-size: 2rem;
    display: block;
  }

  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #14b8a6;
      --accent: #2dd4bf;
      --bg: #134e4a;
      --text: #f0fdfa;
    }
  }
</style>

</head>
<body>

  <h1>My Skills</h1>

  <div class="grid">
    <div class="card" data-icon="🌐">HTML5 — Structure</div>
    <div class="card" data-icon="🎨">CSS3 — Styling</div>
    <div class="card" data-icon="⚡">JavaScript — Behaviour</div>
    <div class="card" data-icon="📐">Flexbox — 1D Layout</div>
    <div class="card" data-icon="🗂">Grid — 2D Layout</div>
    <div class="card" data-icon="📱">Responsive — Any Screen</div>
  </div>

</body>
</html>
