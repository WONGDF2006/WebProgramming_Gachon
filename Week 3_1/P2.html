<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body {
    padding: 40px;
    background: #f0fdfa;
  }

  .card {
    background: white;
    border: 2px solid #14b8a6;
    border-radius: 12px;
    padding: 24px;
    width: 240px;
    color: #0f766e;
    font-size: 16px;

    /* Smooth transition for hover effect */
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .card:hover {
    /* Move card up by 6px */
    transform: translateY(-6px);

    /* Add shadow */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }
</style>

</head>
<body>

  <div class="card">Hover over me!</div>

</body>
</html>
